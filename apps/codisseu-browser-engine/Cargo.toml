[package]
name = "codisseu-browser-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lucstrik/codisseu"
build = "build.rs"
[workspace]
[dependencies]
cef = { version = "=156.3.0", default-features = false, features = ["sandbox", "linux-x11"] }
codisseu-browser = { path = "../../crates/codisseu-browser" }
libc = "=0.2.191"
serde_json = "=1.0.154"
url = "=2.5.8"
sha2 = "=0.10.9"
[profile.dev]
debug = 0
[profile.release]
strip = "debuginfo"
lto = "thin"
