[package]
name = "codisseu-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
[features]
default = ["tab-lcd"]
tab-lcd = []
[build-dependencies]
cc = "=1.9.0"
pkg-config = "=0.3.34"
[dependencies]
codisseu-draw.workspace = true
arboard = { version = "=3.7.0", features = ["wayland-data-control"] }
base64 = "=0.22.1"
eframe.workspace = true
egui.workspace = true
epaint.workspace = true
codisseu-core.workspace = true
codisseu-editor.workspace = true
pulldown-cmark = { version = "=0.13.4", default-features = false }
serde.workspace = true
serde_json.workspace = true
image.workspace = true
unicode-segmentation.workspace = true
regex = "=1.13.1"
portable-pty = "=0.9.0"
vt100 = { version = "=0.18.1", default-features = false }
rfd = "=0.17.2"
[target.'cfg(unix)'.dependencies]
nix = { version = "=0.28.0", features = ["signal", "process"] }
[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
