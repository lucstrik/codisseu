[package]
name = "codisseu-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
codisseu-draw.workspace = true
codisseu-jira.workspace = true
keyring = { version = "=3.6.3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust", "apple-native", "windows-native"] }
sha2 = "=0.10.9"
zeroize = "=1.9.1"
url = "=2.5.8"
codisseu-browser.workspace = true
codisseu-runtime.workspace = true
codisseu-api.workspace = true
codisseu-ai.workspace = true
codisseu-editor = { path = "../codisseu-editor" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
quick-xml = "=0.41.0"
toml = { version = "=1.1.8", default-features = false, features = ["std", "serde", "parse"] }
notify = "=8.2.1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

codisseu-git.workspace = true
codisseu-debug.workspace = true
codisseu-db.workspace = true
codisseu-language.workspace = true
codisseu-syntax = { path = "../codisseu-syntax" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
