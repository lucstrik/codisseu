[package]
name = "codisseu-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
codisseu-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "multipart", "cookies", "gzip", "brotli", "deflate"] }
tokio = { version = "=1.52.3", features = ["rt", "time", "net", "io-util", "sync", "macros"] }
url = "=2.5.8"
base64 = "=0.22.1"
sha2 = "=0.10.9"
serde_yaml = "=0.9.34"

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", features = ["resource"] }
