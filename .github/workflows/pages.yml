name: Publicar site do Codisseu

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  artifact:
    name: Preparar site estático
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Obter somente os arquivos do site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: /website/
          sparse-checkout-cone-mode: false
      - name: Conferir o diretório publicado
        shell: bash
        run: |
          test -f website/index.html
          if find website -type l -print -quit | grep -q .; then
            echo '::error::O site deve conter arquivos próprios, sem links simbólicos.'
            exit 1
          fi
      - name: Guardar apenas o site para publicação
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/
          retention-days: 1

  deploy:
    name: Publicar no GitHub Pages
    needs: artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
